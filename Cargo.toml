[package]
name = "observex"
version = "0.1.1"
edition = "2021"
rust-version = "1.71"
description = "可观测性实现：Instrumentation 的 tracing 实现、op 名清理与有界进程内遥测 sink"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/observex"
homepage = "https://github.com/bytechainx/observex"
documentation = "https://github.com/bytechainx/observex#readme"
readme = "README.md"
keywords = ["observability", "tracing", "instrumentation", "metrics", "telemetry"]
categories = ["development-tools::debugging"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
instrumentationx = { version = "0.1.0", path = "../instrumentationx" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"

[features]
default = []

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
